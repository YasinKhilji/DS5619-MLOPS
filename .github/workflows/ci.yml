name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Week7/week07-cicd
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: flake8 src/

  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Week7/week07-cicd
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/

  integration-test:
    runs-on: ubuntu-latest
    needs: ["lint", "unit-test"]
    defaults:
      run:
        working-directory: Week7/week07-cicd
    steps:
      - uses: actions/checkout@v4
      - name: Run integration test
        run: |
          chmod +x scripts/integration_test.sh
          ./scripts/integration_test.sh